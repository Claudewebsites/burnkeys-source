<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Burnkeys</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Cpath fill='%23FF6A2B' d='M256 70C300 150 392 205 392 318C392 400 330 452 256 452C182 452 120 400 120 320C120 252 164 214 190 156C201 203 218 226 240 233C228 178 232 124 256 70Z'/%3E%3C/svg%3E">
<style>
:root{--bg:#0F0C0A;--panel:#16110E;--row:#1D1713;--edge:#33281F;--text:#E9E1D6;--dim:#8E8378;--faint:#8A7F74;--ember:#FF6A2B;--ember-hi:#FFB23D;--ok:#7BD88F;--bad:#FF5A3C;--warn:#F2C14E;--sel:#2A1C15;--badbg:#2A1410;--badedge:#6B2A1E;--badtext:#FFD5CB;
  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,monospace;--sans:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
:root[data-theme="light"]{--bg:#F6F3EE;--panel:#FFFFFF;--row:#F3EEE7;--edge:#E2D9CE;--text:#1E1813;--dim:#73685E;--faint:#7D7267;--ok:#1F8A4C;--bad:#D23A1E;--warn:#A36A00;--sel:#F7E3D8;--badbg:#FDECE7;--badedge:#F3B7A8;--badtext:#7A2414}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#F6F3EE;--panel:#FFFFFF;--row:#F3EEE7;--edge:#E2D9CE;--text:#1E1813;--dim:#73685E;--faint:#7D7267;--ok:#1F8A4C;--bad:#D23A1E;--warn:#A36A00;--sel:#F7E3D8;--badbg:#FDECE7;--badedge:#F3B7A8;--badtext:#7A2414}}
[hidden]{display:none!important}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:14px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:var(--panel);border:1px solid var(--edge);border-radius:8px;padding:6px 12px;cursor:pointer}
button:hover{border-color:var(--dim)}
button.primary{background:var(--ember);border-color:var(--ember);color:#160A03;font-weight:600}
button.primary:hover{filter:brightness(1.06)}
button.link{background:none;border:0;padding:0;color:var(--dim)}
button.link:hover{color:var(--text)}
button:disabled{opacity:.45;cursor:default}
input[type=text],input[type=password]{background:var(--bg);border:1px solid var(--edge);border-radius:8px;color:var(--text);padding:7px 10px;font:13px var(--mono);width:100%}
:focus-visible{outline:2px solid var(--ember-hi);outline-offset:2px}
.app{display:grid;grid-template-rows:auto 1fr;height:100%}
header{display:flex;align-items:center;gap:12px;padding:12px 18px;border-bottom:1px solid var(--edge);background:var(--panel)}
.native header{-webkit-user-select:none;border-top:0}
.logo{display:flex;align-items:center;gap:8px;font:700 16px var(--mono);letter-spacing:-.5px}
.logo svg{width:30px;height:30px}.logo i{font-style:normal;color:var(--ember)}
.grow{flex:1}
.muted{color:var(--dim);font-size:12.5px}
.body{display:grid;grid-template-columns:200px minmax(0,1fr);min-height:0}
.body:has(aside[hidden]){grid-template-columns:minmax(0,1fr)}
aside{border-right:1px solid var(--edge);padding:14px 10px;overflow:auto;display:flex;flex-direction:column;gap:2px}
.nav{display:flex;align-items:center;gap:9px;width:100%;text-align:left;border:0;background:none;border-radius:8px;padding:8px 10px}
.nav:hover{background:var(--row)}.nav.on{background:var(--sel);font-weight:600}
.nav .c{margin-left:auto;color:var(--faint);font-size:12px;font-weight:400}
.nav .c.bad{color:var(--bad);font-weight:600}
.navsep{height:1px;background:var(--edge);margin:10px 6px}
.lg{width:22px;height:22px;flex:none;display:inline-flex;align-items:center;justify-content:center;border-radius:6px;background:var(--row);color:var(--text);font:700 12px var(--sans)}
.lg svg{width:14px;height:14px;fill:currentColor}
.lg.img{background:#fff}
.lg img{width:16px;height:16px;border-radius:3px}
.cardtop{display:flex;align-items:center;gap:9px}
details.help{display:inline-block;position:relative;vertical-align:middle;margin-left:6px}
details.help summary{list-style:none;cursor:pointer;width:18px;height:18px;border-radius:50%;border:1px solid var(--edge);color:var(--dim);font:600 11px var(--sans);display:inline-flex;align-items:center;justify-content:center}
details.help summary::-webkit-details-marker{display:none}
details.help[open] summary{border-color:var(--ember);color:var(--ember)}
details.help div{position:absolute;z-index:5;top:24px;left:-8px;width:300px;background:var(--panel);border:1px solid var(--edge);border-radius:10px;padding:10px 12px;color:var(--text);font:400 13px/1.5 var(--sans);box-shadow:0 10px 30px rgba(0,0,0,.35)}
.form{display:grid;gap:8px;margin-top:10px}
.form label{color:var(--dim);font-size:12.5px}
.note{border:1px solid var(--edge);background:var(--row);border-radius:10px;padding:11px 14px;margin-bottom:16px;color:var(--text)}
.pro{margin-left:auto;font:600 10.5px var(--sans);color:var(--ember);border:1px solid var(--ember);border-radius:999px;padding:0 6px}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:20px}
.stat{background:var(--panel);border:1px solid var(--edge);border-radius:12px;padding:14px;text-align:left;display:flex;flex-direction:column;justify-content:flex-start;align-items:flex-start;width:100%;height:100%}
.stat .sub{color:var(--faint);font-size:12px;margin-top:2px}
button.stat:hover{border-color:var(--dim)}
.stat .n{font:700 26px var(--sans)}
.stat .l{color:var(--dim);font-size:12.5px}
.todo{display:flex;gap:12px;align-items:center;padding:12px 14px;border-top:1px solid var(--edge)}
.todo:first-child{border-top:0}
.todo .t{flex:1;min-width:0}
.section{margin-top:26px}
.section h2{font:600 15px var(--sans);margin:0 0 10px}
.panel{background:var(--panel);border:1px solid var(--edge);border-radius:12px;padding:16px}
.panel p{margin:0 0 10px;color:var(--dim)}
.act{display:grid;grid-template-columns:130px minmax(0,1fr);gap:12px;padding:10px 14px;border-top:1px solid var(--edge);font-size:13.5px}
.act:first-child{border-top:0}
.act .when{color:var(--faint);font-size:12.5px}
select{background:var(--panel);color:var(--text);border:1px solid var(--edge);border-radius:8px;padding:6px 8px;font:inherit}
main{overflow:auto;padding:22px 26px 60px}
h1{font:600 20px var(--sans);margin:0}
.bar{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.banner{border:1px solid var(--badedge);background:var(--badbg);color:var(--badtext);border-radius:10px;padding:11px 14px;margin-bottom:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.card{text-align:left;background:var(--panel);border:1px solid var(--edge);border-radius:12px;padding:13px 14px;display:flex;flex-direction:column;gap:4px;min-height:84px}
.card:hover{border-color:var(--dim)}
.card.bad{border-color:var(--bad)}
.card b{font-weight:600;font-size:14.5px}
.card.add{border-style:dashed;color:var(--dim);justify-content:center}
.st{font:600 12.5px var(--mono)}
.st.ok,.ok{color:var(--ok)}.st.bad,.bad{color:var(--bad)}.st.warn,.warn{color:var(--warn)}.st.unknown{color:var(--faint);font-weight:400}
.list{border:1px solid var(--edge);border-radius:12px;overflow:hidden;background:var(--panel)}
.item{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:14px;align-items:center;padding:12px 14px;border-top:1px solid var(--edge)}
.item:first-child{border-top:0}
.item .fp{font:12px var(--mono);color:var(--dim);margin-left:6px}
.item .meta{color:var(--dim);font-size:12.5px;margin-top:2px}
.chip{display:inline-block;border:1px solid var(--edge);border-radius:999px;padding:0 8px;font-size:12px;margin:2px 4px 0 0;color:var(--text)}
.actions{display:flex;gap:6px}
.row-link{cursor:pointer}.row-link:hover{background:var(--row)}
.pname{display:flex;align-items:flex-start;gap:10px;min-width:0}.pname .dot{margin-top:7px}.pname>div{min-width:0}.pname b,.pname .meta{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.banner{position:relative;padding-right:40px!important}.banner .x{position:absolute;top:50%;right:10px;transform:translateY(-50%);background:none;border:0;color:inherit;opacity:.6;font-size:16px;padding:2px 6px}.banner .x:hover{opacity:1}
.chip .x{background:none;border:0;padding:0 0 0 5px;color:var(--dim);font-size:12px;line-height:1}.chip .x:hover{color:var(--bad)}
.wiz{display:flex;gap:6px;margin:-4px 0 14px;padding:0;list-style:none;font-size:12px;color:var(--dim)}.wiz li{flex:1;border-top:3px solid var(--edge);padding-top:6px}.wiz li.done{border-color:var(--ok)}.wiz li.now{border-color:var(--ember);color:var(--text);font-weight:600}
.steps{list-style:none;padding:0;margin:12px 0}.steps li{display:flex;gap:10px;align-items:center;padding:6px 0;color:var(--dim)}.steps li.now{color:var(--text);font-weight:600}.steps li .n{width:20px;height:20px;border-radius:50%;border:1px solid var(--edge);display:inline-flex;align-items:center;justify-content:center;font-size:11px;flex:none}.steps li.done .n{background:var(--ok);border-color:var(--ok);color:#0b1a0f}.steps li.now .n{border-color:var(--ember);color:var(--ember)}
.drop{border:1.5px dashed var(--edge);border-radius:10px;padding:22px;text-align:center;color:var(--dim);margin:10px 0}.drop.over{border-color:var(--ember);color:var(--text);background:var(--sel)}
.legend{display:flex;gap:16px;flex-wrap:wrap;color:var(--dim);font-size:12.5px;margin:-4px 0 12px}.legend span{display:inline-flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--faint);flex:none;display:inline-block}
.dot.ok{background:var(--ok)}.dot.bad{background:var(--bad)}.dot.warn{background:var(--warn)}.dot.none{background:transparent;border:1px solid var(--faint)}
.empty{max-width:520px;margin:60px auto;text-align:center}
.empty h1{font-size:24px;margin-bottom:10px}
.empty p{color:var(--dim);margin:0 0 20px}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:20px}
.modal{background:var(--panel);border:1px solid var(--edge);border-radius:14px;width:min(560px,100%);max-height:calc(100% - 40px);overflow:auto;padding:20px}
.modal h2{margin:0 0 8px;font:600 17px var(--sans)}
.modal p{margin:0 0 12px;color:var(--dim)}
.modal .big{color:var(--text);font-size:15px}
.checks{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px;margin:8px 0 14px;max-height:220px;overflow:auto}
.checks label{display:flex;gap:8px;align-items:center;min-width:0}
.checks label span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row{display:flex;gap:8px;align-items:center;justify-content:flex-end;margin-top:14px}
.row .left{margin-right:auto;color:var(--dim);display:flex;gap:6px;align-items:center}
.spin{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--ember);animation:p 1s ease-in-out infinite;margin-right:8px}
@keyframes p{50%{opacity:.25}}
@keyframes turn{to{transform:rotate(360deg)}}#refreshBtn.spinning{animation:turn 1s linear infinite}@media (prefers-reduced-motion:reduce){#refreshBtn.spinning{animation:none;opacity:.5}}
.results{font:12.5px var(--mono);background:var(--bg);border:1px solid var(--edge);border-radius:8px;padding:10px;white-space:pre-wrap}
.foot{color:var(--faint);font-size:12px;margin-top:16px}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}
@media (max-width:720px){.body{grid-template-columns:1fr}aside{flex-direction:row;border-right:0;border-bottom:1px solid var(--edge)}.checks{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="logo"><svg viewBox="0 0 512 512" aria-hidden="true"><defs><linearGradient id="fl" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFC23D"/><stop offset="1" stop-color="#FF3D17"/></linearGradient><mask id="kh"><rect width="512" height="512" fill="#fff"/><circle cx="256" cy="322" r="40" fill="#000"/><path d="M240 340H272L286 410H226Z" fill="#000"/></mask></defs><path fill="url(#fl)" mask="url(#kh)" d="M256 70C300 150 392 205 392 318C392 400 330 452 256 452C182 452 120 400 120 320C120 252 164 214 190 156C201 203 218 226 240 233C228 178 232 124 256 70Z"/></svg></div>
    <span class="grow"></span>
    <span class="muted" id="checked"></span>
    <button id="refreshBtn" title="Refresh: look for new projects and check every key again" aria-label="Refresh" hidden>↻</button>
    <button id="themeBtn" title="Theme: dark" aria-label="Switch theme">◐</button>
    <button class="primary" id="checkBtn" hidden>Check keys</button>
  </header>
  <div class="body">
    <aside id="nav" hidden>
      <button class="nav" data-view="overview">Overview <span class="c" id="cIssues"></span></button>
      <button class="nav" data-view="providers">Providers <span class="c" id="cProviders"></span></button>
      <button class="nav" data-view="projects">Projects <span class="c" id="cProjects"></span></button>
      <button class="nav" data-view="platforms">Platforms <span class="c" id="cPlatforms"></span></button>
      <button class="nav" data-view="activity">Activity</button>
      <button class="nav" data-view="ask">Assistant <span class="pro">Pro</span></button>
      <div class="navsep"></div>
      <button class="nav" data-view="alerts">Alerts <span class="c" id="cAlerts"></span></button>
      <button class="nav" data-view="settings">Settings</button>
      <button class="nav" data-view="account">Account</button>
    </aside>
    <main id="main"><div class="empty"><p>Loading…</p></div></main>
  </div>
</div>
<div id="modal"></div>

<script>
// ---------- theme ----------
const themes = ['dark', 'light', 'auto'];
let theme = 'dark';
try { theme = localStorage.getItem('bk-theme') || 'dark'; } catch {}
const applyTheme = () => {
  if (theme === 'auto') document.documentElement.removeAttribute('data-theme'); else document.documentElement.dataset.theme = theme;
  document.getElementById('themeBtn').title = 'Theme: ' + (theme === 'auto' ? 'automatic' : theme);
  try { window.webkit?.messageHandlers?.burnkeys?.postMessage('theme:' + theme); } catch {}
};
applyTheme();
if (window.webkit?.messageHandlers?.burnkeys) document.documentElement.classList.add('native');

// ---------- session token: from the URL fragment, kept for this tab only ----------
let token = location.hash.slice(1);
try { if (token) sessionStorage.setItem('bk', token); else token = sessionStorage.getItem('bk') || ''; } catch {}
history.replaceState(null, '', '/');
addEventListener('hashchange', () => location.reload());

const api = async (path, body) => {
  const r = await fetch('/api/' + path, { method: body ? 'POST' : 'GET', headers: { 'x-burnkeys-token': token, 'content-type': 'application/json' }, body: body && JSON.stringify(body) });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || 'Something went wrong');
  return j;
};
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const plural = (n, w) => `${n} ${w}${n === 1 ? '' : 's'}`;
let logos = {};
fetch('/logos.json').then((r) => r.json()).then((j) => { logos = j; if (data) { render(); renderModal(); } }).catch(() => {});
const logo = (id, name) => {
  const src = logos[id] ?? data?.icons?.[id] ?? logos[String(id || '').split('-')[0]];
  if (src && src.startsWith('data:')) return `<span class="lg img"><img src="${esc(src)}" alt=""></span>`;
  if (src) return `<span class="lg"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="${src}"/></svg></span>`;
  return `<span class="lg" aria-hidden="true">${esc((name || '?').trim()[0]?.toUpperCase() || '?')}</span>`;
};
const fmtDate = (d) => new Date(d + 'T12:00:00').toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' });
const leakWhere = (l) => `${l.tracked ? 'committed in' : 'in the git history of'} ${l.project}${l.public ? ', a PUBLIC repository' : l.remote ? '' : ' (not pushed anywhere)'}`;
const help = (text) => `<details class="help"><summary aria-label="What is this?">?</summary><div>${text}</div></details>`;

let pluginInstalled = null, settingsErr = null, aiTools = null;
// Alerts the user closed (per key). A key that is replaced gets a new fingerprint, so new problems still show.
let dismissed = new Set();
try { dismissed = new Set(JSON.parse(localStorage.getItem('bk-dismissed') || '[]')); } catch {}
const saveDismissed = () => { try { localStorage.setItem('bk-dismissed', JSON.stringify([...dismissed])); } catch {} };
const closeX = (id) => `<button class="x" data-act="dismiss" data-id="${esc(id)}" title="Close" aria-label="Close">✕</button>`;
let data = null, view = 'overview', detail = null, modal = null, poll = null, busy = false, activityItems = null;

// ---------- rendering ----------
function statusOf(k) {
  if (k.status === 'valid') return '<span class="st ok">✓ Works</span>';
  if (k.status === 'invalid') return '<span class="st bad">✕ Dead</span>';
  if (k.status === 'unknown') return '<span class="st warn">! Couldn\'t check</span>';
  return '<span class="st unknown">Not checked</span>';
}
function providerLine(p) {
  const dead = p.keys.filter((k) => k.status === 'invalid').length;
  const shared = p.keys.filter((k) => k.projects.length > 1 && !k.sharedOk).length;
  const projects = new Set(p.keys.flatMap((k) => k.projects)).size;
  const parts = [];
  if (dead) parts.push(`<span class="bad">✕ ${dead} dead</span>`);
  else if (shared) parts.push(`<span class="warn">! shared by ${projects} projects</span>`);
  else if (p.keys.some((k) => k.status === 'valid')) parts.push('<span class="ok">✓ works</span>');
  else if (p.kind === 'signing') parts.push('<span class="muted">signing secret, nothing to check</span>');
  else if (!p.canCheck && !p.own) parts.push('<span class="muted">can\'t check this one automatically yet</span>');
  parts.push(`<span class="muted">${projects ? plural(projects, 'project') : 'saved, not in a project yet'}</span>`);
  return parts.join(' <span class="muted">·</span> ');
}

function render() {
  const main = document.getElementById('main');
  document.getElementById('nav').hidden = !data.scanned;
  document.getElementById('checkBtn').hidden = !data.scanned;
  document.getElementById('refreshBtn').hidden = !data.scanned;
  if (!data.scanned) {
    main.innerHTML = `<div class="empty"><h1>Find your projects</h1>
      <p>To check your API keys, Burnkeys needs to read your projects. It looks in Desktop, Documents, Developer and your other code folders. macOS will ask you to allow access to these folders. Click Allow. Nothing leaves your Mac.</p>
      <button class="primary" data-act="scan">${busy ? '<span class="spin"></span>Looking…' : 'Find my projects'}</button></div>`;
    return;
  }
  document.querySelectorAll('.nav').forEach((b) => b.classList.toggle('on', b.dataset.view === view));
  document.getElementById('cProviders').textContent = data.providers.filter((p) => !p.own).length;
  document.getElementById('cProjects').textContent = data.projects.length;
  const pb = (data.platforms || []).filter((p) => p.breach).length;
  const cPl = document.getElementById('cPlatforms'); cPl.textContent = pb || (data.platforms || []).length || ''; cPl.className = 'c' + (pb ? ' bad' : '');
  const deadCount = data.providers.flatMap((p) => p.keys).filter((k) => k.status === 'invalid').length;
  const openAlerts = (data.alerts || []).filter((a) => !a.done && !a.closed && a.affected.length).length + (data.leaks || []).length;
  const cA = document.getElementById('cAlerts'); cA.textContent = openAlerts || ''; cA.className = 'c' + (openAlerts ? ' bad' : '');
  const cI = document.getElementById('cIssues'); cI.textContent = deadCount || ''; cI.className = 'c' + (deadCount ? ' bad' : '');
  const last = Math.max(0, ...data.providers.flatMap((p) => p.keys.map((k) => k.checkedAt || 0)));
  const mins = last ? Math.round((Date.now() - last) / 60000) : null;
  document.getElementById('checked').textContent = mins == null ? '' : mins < 1 ? 'Checked just now' : mins < 60 ? `Checked ${mins} min ago` : `Checked ${Math.round(mins / 60)} h ago`;

  const dead = data.providers.flatMap((p) => p.keys.filter((k) => k.status === 'invalid' && !dismissed.has(k.fp)).map((k) => ({ p, k })));
  let banner = dead.length > 2
    ? (dismissed.has('many:' + dead.map((d) => d.k.fp).join()) ? '' : `<div class="banner"><b>${dead.length} keys stopped working.</b> Things that use them are probably broken. <button class="link" data-view-go="overview" style="color:inherit;text-decoration:underline">See what to fix</button>${closeX('many:' + dead.map((d) => d.k.fp).join())}</div>`)
    : dead.map(({ p, k }) => `<div class="banner"><b>Your ${esc(p.name)} key ${k.projects.length ? `in ${esc(k.projects.join(', '))}` : 'saved in your Keychain'} stopped working.</b> ${k.projects.length ? 'Anything that uses it is probably broken.' : 'No project uses it, so nothing is broken.'} <button class="link" data-act="replace" data-provider="${esc(p.id)}" data-fp="${esc(k.fp)}" style="color:inherit;text-decoration:underline">Replace it</button>${closeX(k.fp)}</div>`).join('');

  const breach = (data.alerts || []).filter((a) => !a.done && !a.closed && a.affected.length && !dismissed.has('alert:' + a.id));
  if (data.update && !dismissed.has('update:' + data.update.version)) banner += `<div class="banner" style="border-color:var(--edge);background:var(--panel);color:var(--text)"><b>Burnkeys ${esc(data.update.version)} is available.</b> ${esc(data.update.notes)} <button class="link" data-act="open-url" data-url="${esc(data.update.url)}" style="color:inherit;text-decoration:underline">Download</button>${closeX('update:' + data.update.version)}</div>`;
  banner = breach.map((a) => `<div class="banner"><b>${esc(a.title)} (${esc(fmtDate(a.date))}).</b> ${plural(a.affected.length, 'key')} in ${esc(a.projects.join(', '))} ${a.affected.length === 1 ? 'was' : 'were'} stored there. Replace ${a.affected.length === 1 ? 'it' : 'them'}. <button class="link" data-view-go="alerts" style="color:inherit;text-decoration:underline">See which</button>${closeX('alert:' + a.id)}</div>`).join('') + banner;
  if (!data.projects.length && view !== 'settings') {

      <div class="row" style="justify-content:center"><button class="primary" data-act="add-folder">Choose a folder…</button>${blocked.length ? '<button data-act="open-url" data-url="x-apple.systempreferences:com.apple.preference.security?Privacy_FilesAndFolders">Open System Settings</button>' : ''}</div></div>`;

  if (view === 'overview') return renderOverview(main, deniedNote);

  if (view === 'ask') return renderAsk(main);
  if (view === 'providers' && detail) return renderProvider(main);
  if (view === 'projects' && detail) return renderProject(main);
  if (view === 'providers') {

      <div class="grid">${list.map((p) => `<button class="card ${p.health === 'bad' ? 'bad' : ''}" data-provider-open="${esc(p.id)}"><span class="cardtop">${logo(p.id, p.name)}<b>${esc(p.name)}</b></span><span>${providerLine(p)}</span></button>`).join('')}
      ${data.lockedProviders ? `<button class="card" data-view-go="account"><b>${plural(data.lockedProviders, 'more provider')}</b><span class="muted">The free plan shows ${data.limits.providers}. Get Pro to see all of them.</span></button>` : ''}
      <button class="card add" data-act="catalog">+ Add a provider<span class="muted">OpenAI, Gemini, Supabase, Twilio and ${data.catalog.length > 4 ? data.catalog.length - 4 : 0} more</span></button></div>
      ${own.length ? `<div class="bar" style="margin-top:26px"><h1 style="font-size:16px">Other secrets</h1></div><div class="grid">${own.map((p) => `<button class="card" data-provider-open="${esc(p.id)}"><b>${esc(p.name)}</b><span class="muted">${plural(p.keys.length, 'secret')} · ${p.id === 'self' ? 'passwords and session secrets you made up' : 'keys we couldn\'t match to a provider yet'}</span></button>`).join('')}</div>` : ''}
      <div class="foot">Keys stay on this Mac. This window only ever sees fingerprints and statuses.</div>`;
  } else {
    main.innerHTML = banner + `<div class="bar"><h1>Projects on this Mac${help('Folders Burnkeys recognized as projects (they have a package.json, .git, .env and so on). Keys are read from their .env files, on this Mac only.')}</h1><span class="grow"></span><button class="primary" data-act="new-project">New project</button><button data-act="scan">${busy ? 'Looking…' : 'Look for new projects'}</button></div>
      <div class="legend"><span><span class="dot ok"></span>keys checked and working</span><span><span class="dot bad"></span>has a dead key</span><span><span class="dot"></span>keys we can't check automatically</span><span><span class="dot none"></span>no keys</span></div>
      ${data.limits && data.projects.some((p) => p.locked) ? `<div class="note">Free plan: Burnkeys reads keys from ${data.limits.projects} projects. Choose which with <b>Watch this one</b>, or <button class="link" data-view-go="account" style="text-decoration:underline">get Pro</button> to watch all ${data.projects.length}.</div>` : ''}
      <div class="list">${data.projects.map((p) => p.locked ? `<div class="item"><div class="pname"><span class="dot none"></span><div><b style="color:var(--dim)">${esc(p.name)}</b><span class="meta">${esc(p.path.replace(/^\/Users\/[^/]+/, '~'))}</span></div></div>
        <span class="pro" style="margin:0">Pro</span><button data-act="watch-project" data-path="${esc(p.path)}" title="Read this project's keys instead of one of your current three">Watch this one</button></div>` : `<div class="item row-link" data-project-open="${esc(p.path)}"><div class="pname"><span class="dot ${p.health === 'unknown' ? '' : p.health === 'empty' ? 'none' : p.health}" title="${esc({ ok: 'Keys checked and working', bad: 'Has a dead key', unknown: 'Keys we can\'t check automatically', empty: 'No keys' }[p.health] || '')}"></span><div><b>${esc(p.name)}</b><span class="meta">${esc(p.path.replace(/^\/Users\/[^/]+/, '~'))}</span></div></div>
        <span class="muted">${p.keyCount ? plural(p.keyCount, 'key') : 'no keys yet'}</span><button data-project-open="${esc(p.path)}">Open</button></div>`).join('') || '<div class="item"><span class="muted">No projects found yet.</span></div>'}</div>`;

const day = (t) => new Date(t).toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' });
// When Burnkeys got this key, what it replaced or was replaced by, and when it went to Vercel.
const HOSTS = new Set(['vercel', 'railway', 'netlify', 'fly', 'render', 'heroku', 'digitalocean', 'cloudflare', 'aws']);
const PUSH = new Set(['vercel', 'railway', 'netlify', 'fly', 'render']); // hosts Burnkeys can update itself
function keyHistory(k) {
  const h = k.history || {}, out = [];
  if (h.addedAt) out.push(`added ${day(h.addedAt)}`); else if (k.firstSeen) out.push(`found ${day(k.firstSeen)}`);
  if (h.replaced) out.push(`replaced ${esc(h.replaced.fp)} on ${day(h.replaced.at)}`);
  if (h.replacedBy) out.push(`replaced by ${esc(h.replacedBy.fp)} on ${day(h.replacedBy.at)}${h.keptAt ? ', kept for other projects' : ''}`);
  if (h.vercelAt) out.push(`on Vercel since ${day(h.vercelAt)}`);
  return out.length ? `<div class="meta muted" style="font-size:12px">${out.join(' · ')}</div>` : '';
}
function keyRow(p, k, showProjects = true, inProject = null) {
  const canReplace = !p.own && p.inCatalog;
  const chip = (n) => `<span class="chip"><button class="link" data-project-name="${esc(n)}" title="Open ${esc(n)}" style="color:inherit;font-size:inherit">${esc(n)}</button><button class="x" data-act="remove-from" data-provider="${esc(p.id)}" data-fp="${esc(k.fp)}" data-project="${esc(n)}" title="Remove this key from ${esc(n)}" aria-label="Remove from ${esc(n)}">✕</button></span>`;
  const sharedNote = k.projects.length > 1 ? (k.sharedOk
    ? ' <span class="muted">shared on purpose</span> <button class="link" data-act="shared-ok" data-fp="' + esc(k.fp) + '" data-ok="0" style="text-decoration:underline;font-size:12px">warn me again</button>'
    : ' <span class="warn">shared</span> <button class="link" data-act="shared-ok" data-fp="' + esc(k.fp) + '" style="text-decoration:underline;font-size:12px">ignore</button>') : '';
  return `<div class="item"><div><b>${esc(k.names.join(', ') || p.name)}</b><span class="fp">${esc(k.fp)}</span>${k.saved ? ' <span class="chip">in Keychain</span>' : ''}
    <div class="meta">${showProjects ? (k.projects.length ? k.projects.map(chip).join('') : 'not used in any project') : ''}${sharedNote}</div>${keyHistory(k)}</div>
    ${p.own ? '<span class="muted">your own secret</span>' : statusOf(k)}
    <span class="actions">${!p.own && k.status !== 'invalid' ? `<button data-act="use" data-provider="${esc(p.id)}" data-fp="${esc(k.fp)}" title="Add this key to more projects">Add to projects</button>` : ''}${!p.own && (k.projects.length || k.saved) ? `<button data-act="revoke" data-provider="${esc(p.id)}" data-fp="${esc(k.fp)}" title="Delete this key at the provider and remove it from your projects">Revoke</button>` : ''}${canReplace ? `<button data-act="replace" data-provider="${esc(p.id)}" data-fp="${esc(k.fp)}" title="${k.status === 'invalid' ? 'Create a new key and put it everywhere this dead one is used' : 'Replace this key with a new one in every project that uses it'}">Replace</button>` : ''}${inProject ? `<button data-act="remove-from" data-provider="${esc(p.id)}" data-fp="${esc(k.fp)}" data-project="${esc(inProject)}" title="Remove this key from ${esc(inProject)} only">Remove</button>` : ''}${k.saved && !k.projects.length ? `<button data-act="forget" data-fp="${esc(k.fp)}" title="Delete this saved key from your Keychain">Delete</button>` : ''}</span></div>`;
}

function renderOverview(main, banner) {
  const keys = data.providers.filter((p) => !p.own).flatMap((p) => p.keys.map((k) => ({ p, k })));
  const dead = keys.filter(({ k }) => k.status === 'invalid');
  const allShared = keys.filter(({ k }) => k.projects.length > 1);
  const shared = allShared.filter(({ k }) => !k.sharedOk);
  const unchecked = keys.filter(({ p, k }) => !k.status && !p.canCheck);
  const working = keys.filter(({ k }) => k.status === 'valid');
  const todo = [
    ...(data.leaks || []).map((l) => `<div class="todo"><span class="st bad">✕</span><div class="t"><b>${l.public ? 'Leaked: ' : ''}Your ${esc(l.providerName)} key is ${esc(leakWhere(l))}</b><div class="muted">${l.public ? 'Anyone can read it. Replace it now, then delete the old one.' : 'Anyone who gets a copy of this repository has the key. Replace it, then delete the old one.'}</div></div><span class="actions"><button data-act="leak-ok" data-fp="${esc(l.fp)}" title="I know, it's fine">Ignore</button>${l.inCatalog && !l.own ? `<button class="primary" data-act="replace" data-provider="${esc(l.providerId)}" data-fp="${esc(l.fp)}">Replace</button>` : ''}</span></div>`),
    ...(data.alerts || []).filter((a) => !a.done && !a.closed && a.affected.length).map((a) => `<div class="todo"><span class="st bad">!</span><div class="t"><b>${esc(a.title)}: replace ${plural(a.affected.length, 'key')}</b><div class="muted">${esc(a.projects.join(', '))} ${a.projects.length === 1 ? 'is' : 'are'} deployed on ${esc(a.platformName)}.</div></div><span class="actions"><button data-act="alert-done" data-id="${esc(a.id)}" title="I already replaced these keys">I've handled this</button><button class="primary" data-view-go="alerts">See which</button></span></div>`),
    ...dead.map(({ p, k }) => `<div class="todo"><span class="st bad">✕</span><div class="t"><b>Replace the dead ${esc(p.name)} key</b><div class="muted">${esc(k.names.join(', '))} in ${esc(k.projects.join(', '))}</div></div><button class="primary" data-act="replace" data-provider="${esc(p.id)}" data-fp="${esc(k.fp)}">Replace</button></div>`),
    ...shared.map(({ p, k }) => `<div class="todo"><span class="st warn">!</span><div class="t"><b>Give each project its own ${esc(p.name)} key</b><div class="muted">One key is shared by ${esc(k.projects.join(', '))}. If it leaks, all of them break.</div></div><span class="actions"><button data-act="shared-ok" data-fp="${esc(k.fp)}" title="Keep sharing this key and stop warning about it">Ignore</button><button data-act="add" data-provider="${esc(p.id)}" title="Create a separate key, so each project has its own">New key</button></span></div>`),
  ];
  main.innerHTML = banner + `<div class="bar"><h1>Overview${help('A summary of every key on this Mac. A dead key means the provider rejected it, so anything using it is broken. A shared key is used by more than one project: if it leaks, all of them are exposed.')}</h1></div>
    <div class="stats">
      <button class="stat" data-view-go="projects"><div class="n">${data.projects.length}</div><div class="l">projects on this Mac</div></button>
      <button class="stat" data-keys="all"><div class="n">${keys.length}</div><div class="l">API keys</div></button>
      <button class="stat" data-keys="dead"><div class="n ${dead.length ? 'bad' : ''}">${dead.length}</div><div class="l">dead keys</div></button>
      <button class="stat" data-keys="shared"><div class="n ${shared.length ? 'warn' : ''}">${allShared.length}</div><div class="l">shared between projects</div>${allShared.length > shared.length ? `<div class="sub">${allShared.length - shared.length} on purpose</div>` : ''}</button>
    </div>
    <div class="section"><h2>What to do now</h2><div class="list">${todo.join('') || `<div class="todo"><span class="st ok">✓</span><div class="t"><b>Nothing urgent.</b><div class="muted">${working.length} keys checked and working${unchecked.length ? `, ${unchecked.length} can't be checked automatically yet` : ''}.</div></div></div>`}</div></div>
    ${data.plan === 'pro' ? '' : `    <div class="section"><h2>Keep watching while you sleep</h2><div class="panel"><p>With Pro, Burnkeys emails you the moment a key stops working, or when a service you use gets breached.</p><button data-view-go="alerts">See Alerts</button></div></div>`}`;
}

// Text for each activity entry. Each line is built only for its own type.
const list = (x) => (Array.isArray(x) ? x.join(', ') : '');
const ACT = {
  scan: (a) => `Found ${a.projects} projects in ${a.folders} folders`,
  dead: (a) => `${a.provider} key ${list(a.names)} stopped working`,
  'new-key': (a) => `New ${a.provider} key added${a.verified ? ' and checked' : ''}`,
  'new-key-for-replace': (a) => `New ${a.provider} key created to replace ${a.oldFp}${a.verified ? ' (checked, works)' : ''}`,
  applied: (a) => `${a.variable} written to ${list(a.projects) || 'no projects'}${a.ok ? '' : ' (with errors)'}${a.vercel?.length ? `. Vercel: ${a.vercel.join('; ')}` : ''}`,
  removed: (a) => `Key ${a.fp} removed from ${list(a.projects)}`,
  'revoked-confirmed': (a) => `Old ${a.provider} key ${a.fp} confirmed dead`,
  'hook-on': (a) => `Commits with keys are now blocked in ${a.project}`,
  'hook-off': (a) => `Commit check removed from ${a.project}`,
  'kept-old': (a) => `Kept the old key ${a.fp} for its other projects`,
  'revoked-auto': (a) => `Burnkeys deleted the old ${a.provider} key ${a.fp}`,
  leak: (a) => `Key ${a.fp} found in ${a.where} of ${a.project}${a.public ? ' (public repository)' : ''}`,

  'signed-in': () => 'Signed in to your Burnkeys account',

};
const actText = (a) => { try { return (ACT[a.type] ?? (() => a.type))(a); } catch { return a.type; } };

function renderActivity(main) {

  main.innerHTML = `<div class="bar"><h1>Activity</h1><span class="muted">Everything Burnkeys did, on this Mac. Fingerprints only, never key values.</span></div>
    <div class="list">${activityItems.map((a) => `<div class="act"><span class="when">${new Date(a.at).toLocaleString()}</span><span>${esc(actText(a))}</span></div>`).join('') || '<div class="act"><span></span><span class="muted">Nothing yet.</span></div>'}</div>`;
}

      <div class="row" style="justify-content:flex-start">${a.done ? `<button data-act="alert-done" data-id="${esc(a.id)}" data-undo="1">Mark as not done</button>` : `<button data-act="alert-done" data-id="${esc(a.id)}">I've handled this</button>`}</div>
    </div></div>`;
  main.innerHTML = `<div class="bar"><h1>Alerts${help('Breaches at services you use, and keys that ended up in git. Burnkeys downloads the list of breaches from burnkeys.com and matches it on this Mac: nothing about your projects or keys is sent.')}</h1><span class="grow"></span><button data-act="leak-scan">${busy ? '<span class="spin"></span>Checking git…' : 'Check git for leaks'}</button></div>

}

function renderSettings(main) {

// Every replaceable key used by a project on this platform.

  return data.providers.filter((p) => !p.own && p.inCatalog).flatMap((p) => p.keys.filter((k) => k.projects.some((n) => pl.projects.includes(n))).map((k) => ({ providerId: p.id, fp: k.fp, name: p.name })));
}

    <div class="grid">${list.map((p) => `<div class="card ${p.breach ? 'bad' : ''}" style="cursor:default"><span class="cardtop">${logo(p.id, p.name)}<b>${esc(p.name)}</b></span>
      <span>${p.breach ? `<span class="bad">✕ Breach reported ${esc(fmtDate(p.breach.date))}</span>${p.breach.keys ? ` <span class="muted">· ${plural(p.breach.keys, 'key')} to replace</span>` : ''}` : '<span class="ok">✓ No breach reported</span>'}</span>

// A key file is read here and sent only to the local Burnkeys engine (127.0.0.1).
async function sendPartFile(file) {
  if (file.size > 100_000) { modal.err = 'That file is too big to be a key file.'; renderModal(); return; }

  try { await api('add-key/manual', { key: text }); modal.err = null; } catch (err) { modal.err = err.message; }
  await refresh();
}
// Dropping a file anywhere else must not navigate away from the app.
addEventListener('dragover', (e) => e.preventDefault());
addEventListener('drop', (e) => e.preventDefault());

async function refresh() {
  data = await api('overview');
  if (modal?.kind === 'job' && data.job && data.job.id === modal.job?.id && !['saving', 'done'].includes(modal.job.step)) modal.job = data.job;
  render();
  const typing = document.activeElement?.id === 'manualKey' || document.querySelector('#modal details[open]');
  const sameField = modal?.lastField === `${modal?.job?.id}:${modal?.job?.fieldIndex}`;
  if (!(typing && modal?.job?.step === 'waiting-for-copy' && (!modal.job.fields || sameField))) renderModal();
  if (modal?.job) modal.lastField = `${modal.job.id}:${modal.job.fieldIndex}`;
  const live = modal?.kind === 'job' && ['waiting-for-copy', 'checking'].includes(modal.job?.step);
  if (live && !poll) poll = setInterval(refresh, 800);
  if (!live && poll) { clearInterval(poll); poll = null; }
}

// Replacing a key is four steps; show where the user is.
function wiz(i) {
  if (!modal?.replaceFp && !modal?.wizard) return '';
  const head = batch ? `<p class="muted" style="margin:-6px 0 8px">${esc(batch.label)}: key ${batch.i + 1} of ${batch.items.length}</p>` : '';
  return head + `<ol class="wiz" aria-label="Step ${i + 1} of 4">${['New key', 'Check it', 'Projects', 'Revoke the old key'].map((t, n) => `<li class="${n < i ? 'done' : n === i ? 'now' : ''}">${t}</li>`).join('')}</ol>`;
}
// Replace several keys in a row (a breach, or every key on a platform): one wizard per key,
// then one list of old keys to revoke at the end.
let batch = null;
function startBatch(items, label) {
  const list = items.filter((x) => x.inCatalog !== false && !x.own);
  if (!list.length) return;
  batch = { label, items: list, i: 0, replaced: [], skipped: [] };
  startAdd(list[0].providerId, list[0].fp);
}
function batchNext(skip) {
  if (!batch) return;
  const cur = batch.items[batch.i];
  (skip ? batch.skipped : batch.replaced).push(cur);
  batch.i++;
  if (batch.i < batch.items.length) { const n = batch.items[batch.i]; startAdd(n.providerId, n.fp); return; }
  modal = { kind: 'batchdone' }; renderModal(); refresh();
}
async function startAdd(providerId, replaceFp) {
  const p = data.providers.find((x) => x.id === providerId) || data.catalog.find((x) => x.id === providerId);
  modal = { kind: 'job', providerName: p?.name, replaceFp: replaceFp || null, job: null };
  renderModal();
  try { modal.job = await api('add-key', { providerId, ...(replaceFp ? { replaceFp } : {}) }); }
  catch (e) { modal.job = { step: 'failed', message: e.message, providerId }; }
  await refresh();
}

  }
  if (act === 'apply') {
    const variable = document.getElementById('varName').value.trim();
    const vercel = !!document.getElementById('vercel')?.checked;
    const hosts = [...document.querySelectorAll('.hostpick:checked')].map((x) => x.value);
    const projects = [...modal.selected];
    const j = modal.job;
    modal.job = { ...j, step: 'saving' }; renderModal();
    try {
      const r = await api('apply', { fp: j.fp, projects, variable, vercel, hosts });
      modal.job = { ...j, step: 'done', results: r.results };
    } catch (err) { modal.job = { ...j, step: 'failed', message: err.message }; }
    renderModal(); data = await api('overview'); render();
  }
});
window.burnkeysPickedProjectFolder = (path) => { if (modal?.kind === 'newproject') { modal.where = path; renderModal(); } };
window.burnkeysPickedFolder = async (path) => { busy = true; render(); try { data = await api('folders', { add: path }); } finally { busy = false; } render(); };
document.addEventListener('change', (e) => {
  if (e.target.id === 'everySel') {
    api('settings', { checkEveryMin: Number(e.target.value) }).then((d) => { data = d; settingsErr = null; render(); })
      .catch((err) => { settingsErr = err.message; render(); });
  }
  if (e.target.id === 'bgToggle') {
    const on = e.target.checked;
    api('settings', { background: on }).then((d) => { data = d; settingsErr = null; render(); })
      .catch((err) => { settingsErr = err.message; data.background = !on; render(); });
  }
  if (e.target.dataset?.platform) {
    api('platform', { path: e.target.dataset.path, platform: e.target.dataset.platform, on: e.target.checked }).then((d) => { data = d; render(); }).catch(() => {});
  }
  if (e.target.id === 'partFile' && e.target.files[0]) sendPartFile(e.target.files[0]);
  if (e.target.id === 'npWhere' && e.target.value === '__other') {
    modal.name = document.getElementById('npName')?.value;
    if (window.webkit?.messageHandlers?.burnkeys) window.webkit.messageHandlers.burnkeys.postMessage('pickProjectFolder');
    else { const path = prompt('Full path of the folder to create the project in:'); if (path) window.burnkeysPickedProjectFolder(path); else renderModal(); }
  }
  if (e.target.id === 'themeSel') { theme = e.target.value; applyTheme(); try { localStorage.setItem('bk-theme', theme); } catch {} }
});
document.addEventListener('input', (e) => {
  if (e.target.id === 'catSearch') { modal.q = e.target.value; renderModal(); }
  if (e.target.id === 'varName' && modal) modal.variable = e.target.value;
  if (e.target.id === 'askBox') draft = e.target.value;
});
document.addEventListener('keydown', (e) => { if (e.target.id === 'askBox' && e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); document.querySelector('[data-act=ask]')?.click(); } });
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && modal && (modal.kind === 'catalog' || ['failed', 'cancelled', 'done'].includes(modal.job?.step))) { modal = null; renderModal(); } });

setInterval(() => { if (!modal && document.activeElement?.id !== 'askBox') refresh().catch(() => {}); else api('ping', {}).catch(() => {}); }, 60_000);
refresh().then(async () => { if (data.scanned) { data = await api('check', {}); render(); } }).catch((e) => {
  document.getElementById('main').innerHTML = `<div class="empty"><p>Couldn't connect to Burnkeys (${esc(e.message)}). Quit and open it again.</p></div>`;
});
</script>
</body>
</html>
